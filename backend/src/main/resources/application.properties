spring.application.name=stockpulse-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/stockpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration-h2}

logging.level.org.springframework=INFO
logging.level.com.stockpulse=INFO

commerce.strategy=${COMMERCE_STRATEGY:rule}
llm.provider=${LLM_PROVIDER:openai-compatible}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net}
llm.model=${LLM_MODEL:qwen-cursor}
llm.api-key=${LLM_API_KEY:}
llm.product-header=${LLM_PRODUCT_HEADER:PC1}
